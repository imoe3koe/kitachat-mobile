name: kitachat_mobile
description: Aplikasi chat keluarga KitaChat dengan fitur WebRTC, GPS tracking, album, dan agenda keluarga.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.4 <4.0.0'  # ✅ Dart 3.5.x - Null Safety mode

dependencies:
  flutter:
    sdk: flutter

  # UI & Material Design
  cupertino_icons: ^1.0.8

  # ===== NETWORKING & REALTIME =====
  http: ^1.2.0              # REST API calls
  http_parser: ^4.0.8       # Parse HTTP payloads
  socket_io_client: ^3.1.6  # WebSocket untuk real-time chat

  # ===== WEBRTC (Panggilan Keluarga Peer-to-Peer) =====
  flutter_webrtc: ^1.6.2    # ✅ UPDATED: WebRTC native implementation

  # ===== MEDIA HANDLING =====
  image_picker: ^1.1.2      # Pick gambar dari galeri
  file_picker: ^11.0.3      # File picker untuk PDF & files

  # ===== LINK DETECTION & LAUNCHING =====
  flutter_linkify: ^6.0.0   # Detect & format links di chat
  url_launcher: ^6.3.1      # Launch URLs dan deep links

  # ===== AUDIO RECORDING & PLAYBACK =====
  record: ^6.2.1            # Voice note recording (mendukung Web & Mobile)
  audioplayers: ^6.0.0      # Playback audio dari URL

  # ===== IMAGE CACHING =====
  cached_network_image: ^3.4.1  # Cache & optimize image loading

  # ===== PERMISSIONS =====
  permission_handler: ^13.0.2  # Request microphone, storage, location

  # ===== LOCATION & GPS TRACKING =====
  geolocator: ^14.0.2       # GPS location dengan akurasi tinggi

  # ===== FILE & STORAGE =====
  path_provider: ^2.1.5     # Get app directory paths
  open_filex: ^4.5.0        # Open files with default apps
  path: ^1.9.0              # Path manipulation utilities

  # ===== FORMATTING =====
  intl: ^0.20.2             # Internationalization & date formatting

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0     # Lint rules untuk Dart 3.5.x

flutter:
  uses-material-design: true

  # Assets management
  assets:
    - assets/images/
    - assets/icons/

# ===== BUILD TARGETS =====
# Mobile: Android API 21+ (Flutter 3.24.x requirement)
# Minimum Dart: 3.5.4
