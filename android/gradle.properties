# Konfigurasi Gradle untuk Flutter 3.24.x + Java 17 + Dart 3.5.x

# --- JVM Configuration untuk Java 17 ---
# 🔧 Atur memory untuk build process
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:ErrorFile=/tmp/hs_err_pid%p.log

# --- Kotlin & AndroidX Configuration ---
android.useAndroidX=true           # ✅ Wajib untuk Flutter 3.24.x
android.enableJetifier=false       # Set false karena sudah pure AndroidX
android.newDsl=true                # Gunakan Kotlin DSL untuk Gradle scripts
android.builtInKotlin=true         # Built-in Kotlin untuk AGP 9.1.0+

# --- Build Performance ---
org.gradle.kotlin.dsl.skip.compile.avoidance=true  # Percepat build dengan skipping unnecessary compilation
org.gradle.parallel=true            # Parallel compilation untuk lebih cepat
org.gradle.caching=true             # Build cache untuk incremental builds

# --- Dart 3.5.x Compatibility ---
# ✅ Ensure null-safety mode untuk Dart 3.5.x
org.gradle.unsafe.build.features.buildonce=false  # Jika perlu rebuild selalu

# --- Debugging (set ke false untuk production) ---
android.enableOnDemandModules=true  # On-demand module loading
